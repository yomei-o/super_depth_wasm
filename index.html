<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Super Depth (PC-98) — C 移植の途中</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: #0b1018; color: #c8d0d8;
    font: 13px/1.6 system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 12px;
  }
  canvas {
    /* 640x400 をソフトウェアで描いて、ブラウザに最近傍で拡大させるだけ。
       WebGL は使っていない。 */
    image-rendering: pixelated;
    width: 960px; height: 600px;
    max-width: 100vw; max-height: 68vh;
    background: #000;
    border: 1px solid #263040;
  }
  .keys { opacity: .75; text-align: center; }
  kbd {
    background: #1a2230; border: 1px solid #2d3849; border-radius: 3px;
    padding: 0 4px; font-family: inherit;
  }
  #note {
    max-width: 960px; opacity: .7; font-size: 12px;
    border-top: 1px solid #1e2734; padding-top: 8px;
  }
  #status { min-height: 1.5em; opacity: .8; }
  a { color: #7fb2ff; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400"></canvas>
<div class="keys">
  <kbd>&larr;</kbd> <kbd>&rarr;</kbd> 移動 &nbsp;
  <kbd>Z</kbd>/<kbd>Space</kbd> 左の爆雷 &nbsp;
  <kbd>X</kbd>/<kbd>Enter</kbd> 右の爆雷 &nbsp;
  <kbd>1</kbd>…<kbd>9</kbd> ステージ切替
</div>
<div id="status">読み込み中…</div>
<div id="note">
  <strong>まだ移植の途中です。</strong>
  Bio_100% の PC-98 版 <em>Super Depth</em> (1991) を Ghidra で解析して C に
  書き直しているところで、今できているのは 640×400 16 色の画面、BFNT
  スプライトの読み込み、本物のパレット、自機の移動と爆雷の投下だけです。
  敵・アイテム・ボス・BGM はまだ入っていません。
  解析メモは <a href="https://github.com/yomei-o/super_depth_wasm">GitHub</a> の
  RESUME.md にあります。
</div>

<script>
const PAD = { LEFT: 1, RIGHT: 2, A: 4, B: 8 };
const KEYMAP = {
  ArrowLeft: PAD.LEFT,  KeyH: PAD.LEFT,
  ArrowRight: PAD.RIGHT, KeyL: PAD.RIGHT,
  KeyZ: PAD.A, Space: PAD.A,
  KeyX: PAD.B, Enter: PAD.B,
};

const cv = document.getElementById('screen');
const ctx2d = cv.getContext('2d', { alpha: false });
const statusEl = document.getElementById('status');
let pad = 0;

var Module = {
  onRuntimeInitialized() {
    if (Module._sd_init() !== 0) {
      statusEl.textContent = 'BFNT の読み込みに失敗しました';
      return;
    }
    const w = Module._sd_width(), h = Module._sd_height();
    const img = ctx2d.createImageData(w, h);
    statusEl.textContent =
      `${w}x${h} 16色 / パターン ${Module._sd_patterns()} 枚`;

    setInterval(() => {
      Module._sd_tick(pad);
      const p = Module._sd_framebuffer();
      img.data.set(Module.HEAPU8.subarray(p, p + w * h * 4));
      ctx2d.putImageData(img, 0, 0);
    }, 17);
  }
};

addEventListener('keydown', e => {
  if (e.code >= 'Digit1' && e.code <= 'Digit9') {
    Module._sd_set_stage(+e.code.slice(5));
    e.preventDefault();
    return;
  }
  const bit = KEYMAP[e.code];
  if (bit) { pad |= bit; e.preventDefault(); }
});
addEventListener('keyup', e => {
  const bit = KEYMAP[e.code];
  if (bit) { pad &= ~bit; e.preventDefault(); }
});
</script>
<script src="superdepth.js"></script>
</body>
</html>
